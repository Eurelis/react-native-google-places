buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.12.0"
    }
}

apply plugin: "com.android.library"

def DEFAULT_COMPILE_SDK_VERSION             = 36
def DEFAULT_TARGET_SDK_VERSION              = 36
def DEFAULT_MIN_SDK_VERSION                 = 24

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    namespace "com.arttitude360.reactnative.rngoogleplaces"
    compileSdk safeExtGet("compileSdkVersion", DEFAULT_COMPILE_SDK_VERSION)

    defaultConfig {
        minSdk safeExtGet("minSdkVersion", DEFAULT_MIN_SDK_VERSION)
        targetSdk safeExtGet("targetSdkVersion", DEFAULT_TARGET_SDK_VERSION)
        resValue "string", "places_api_key", (System.env.RNGP_ANDROID_API_KEY ? "$System.env.RNGP_ANDROID_API_KEY" : (rootProject.findProperty("RNGP_ANDROID_API_KEY") ?: "INSERT_KEY_HERE"))
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                "META-INF/LICENSE",
                "META-INF/DEPENDENCIES.txt",
                "META-INF/LICENSE.txt",
                "META-INF/NOTICE.txt",
                "META-INF/NOTICE",
                "META-INF/DEPENDENCIES",
                "META-INF/notice.txt",
                "META-INF/license.txt",
                "META-INF/dependencies.txt",
                "META-INF/LGPL2.1"
            ]
        }
    }

    lint {
        disable += "InvalidPackage"
    }
}

repositories {
    google()
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation "com.facebook.react:react-android"
    implementation "com.google.android.libraries.places:places:3.0.0"
    implementation "androidx.appcompat:appcompat:1.5.1"
}
